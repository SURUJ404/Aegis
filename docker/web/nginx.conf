server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The shell must never be cached: a stale index.html would point at asset
    # hashes that a redeploy has already replaced.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed assets are immutable; everything else falls through to the shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /engine) fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
