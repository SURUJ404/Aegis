apiVersion: v1
kind: ConfigMap
metadata:
  name: lq-config
  namespace: liquidity
data:
  lq.toml: |
    mode = "paper"
    symbols = ["BTC-USDT"]
    venues = ["paper", "simulated"]

    [paper]
    base_latency_ms = 2.0
    latency_jitter_ms = 1.0

    [strategy.market_making]
    quote_refresh_ms = 250

    [risk]
    max_order_rate_per_sec = 20.0

    [telemetry]
    metrics_bind = "0.0.0.0:9100"

    [api]
    bind = "0.0.0.0:8080"

    [persistence]
    enabled = false
    postgres_url = "postgres://lq:lq@postgres:5432/liquidity"
    redis_url = "redis://redis:6379"
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: lq-engine
        static_configs:
          - targets: ["trading-engine:9100"]
      - job_name: lq-market-data
        static_configs:
          - targets: ["market-data-service:9100"]
