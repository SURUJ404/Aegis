apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  namespace: liquidity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-engine
  template:
    metadata:
      labels:
        app: trading-engine
    spec:
      containers:
        - name: trading-engine
          image: lq/trading-engine:0.1.0
          args: ["--config", "/config/lq.toml"]
          ports:
            - containerPort: 8080
              name: api
            - containerPort: 9100
              name: metrics
          env:
            - name: LQ_CONFIG
              value: /config/lq.toml
          volumeMounts:
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 3
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/state
              port: api
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: lq-config
---
apiVersion: v1
kind: Service
metadata:
  name: trading-engine
  namespace: liquidity
spec:
  selector:
    app: trading-engine
  ports:
    - port: 8080
      targetPort: 8080
      name: api
    - port: 9100
      targetPort: 9100
      name: metrics
