server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Engine control-plane API lives in the trading-engine service.
    location /api/ {
        proxy_pass http://trading-engine:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://trading-engine:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}