[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/core",
    "crates/exchange",
    "crates/orderbook",
    "crates/market-data",
    "crates/strategy",
    "crates/risk",
    "crates/execution",
    "crates/simulator",
    "crates/backtest",
    "crates/persistence",
    "crates/telemetry",
    "crates/api",
    "apps/trading-engine",
    "apps/market-data-service",
    "apps/backtest-runner",
    "apps/simulator",
    "apps/api-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["rust-liquidity-engine"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
toml = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# Errors / misc
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# Numerics
rust_decimal = { version = "1", features = ["serde", "maths"] }
rust_decimal_macros = "1"

# HTTP / WS clients
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
axum = "0.8"

# Persistence
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal"] }
redis = { version = "0.27", features = ["tokio-comp"] }

# Concurrency helpers
dashmap = "6"
parking_lot = "0.12"

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# Benchmarking
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
debug = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
